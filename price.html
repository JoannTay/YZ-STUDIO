<!DOCTYPE html>
<html lang="zh-Hans-MY">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YZ Studio｜价格表合集 - 王者荣耀・和平精英・火影忍者・无畏契约</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<style>
:root{
  --paper:#FBF8F3;--paper-2:#F3EEE5;--card:#FFFFFF;
  --ink:#23201D;--muted:#6F6961;--muted-2:#938C82;
  --red:#AF3526;--red-deep:#8C271B;--red-soft:#F6E7E2;
  --gold:#B98B2E;--green:#16A34A;
  --line:#E7E0D4;--line-2:#D8CFBF;
  --sans:'Inter','Noto Sans SC','PingFang SC','Microsoft YaHei',-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:'JetBrains Mono','SF Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;overflow-x:clip;scroll-padding-top:118px}
body{overflow-x:clip;background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
img{max-width:100%;display:block}
a{color:inherit}
.wrap{max-width:1060px;margin:0 auto;padding:0 16px}

/* top bar */
.topbar{background:rgba(251,248,243,.92);backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;height:56px}
.brand{display:flex;align-items:baseline;gap:10px;text-decoration:none}
.brand b{font-size:17px;font-weight:800;letter-spacing:.1em}
.brand span{font-size:11px;color:var(--muted-2);letter-spacing:.28em;font-weight:500}
.wa-mini{background:var(--green);color:#fff;text-decoration:none;font-size:13px;font-weight:700;
  padding:7px 14px;border-radius:999px;white-space:nowrap}

/* chips nav */
.chips{position:sticky;top:56px;z-index:40;background:var(--paper);border-bottom:1px solid var(--line)}
.chips .wrap{display:flex;gap:8px;overflow-x:auto;padding-top:10px;padding-bottom:10px;scrollbar-width:none}
.chips .wrap::-webkit-scrollbar{display:none}
.chips a{flex:none;text-decoration:none;font-size:13.5px;font-weight:600;color:var(--ink);
  background:var(--card);border:1px solid var(--line-2);border-radius:999px;padding:5px 13px;transition:.15s}
.chips a:hover,.chips a.on{background:var(--red);border-color:var(--red);color:#fff}

/* header */
.head{padding:40px 0 8px}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--gold);display:block;margin-bottom:10px;font-weight:700}
h1{font-size:clamp(28px,6vw,42px);font-weight:900;line-height:1.25}
.lead{color:var(--muted);margin-top:12px;max-width:56ch;font-size:15.5px}
.notes{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.notes span{font-size:12.5px;background:var(--red-soft);color:var(--red-deep);border-radius:8px;padding:4px 10px;font-weight:600}

/* grid of price cards */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;padding:28px 0 56px}
@media(max-width:720px){.grid{grid-template-columns:1fr;gap:16px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;
  box-shadow:0 1px 2px rgba(35,32,29,.04),0 8px 24px -16px rgba(35,32,29,.18)}
.card-head{display:flex;align-items:center;gap:10px;padding:14px 16px}
.rank{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--muted-2);min-width:22px}
.card-head h2{font-size:17px;font-weight:800;flex:1;line-height:1.35}
.tag{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--paper-2);color:var(--muted)}
.tag.hot{background:var(--red);color:#fff}
.shot{display:block;width:100%;background:var(--paper-2);aspect-ratio:1/1;cursor:zoom-in;border:0;padding:0}
.shot img{width:100%;height:100%;object-fit:contain}
.shot .missing{display:flex;height:100%;align-items:center;justify-content:center;color:var(--muted-2);font-size:13px}
.card-foot{padding:12px 16px 16px}
.order{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;text-decoration:none;
  background:var(--green);color:#fff;font-weight:700;font-size:14.5px;border-radius:12px;padding:10px}
.order:hover{filter:brightness(1.06)}

/* footer */
footer{background:#221E1B;color:#CFC7BC;padding:36px 0 44px;font-size:14px}
footer h3{color:#fff;font-size:16px;margin-bottom:8px}
footer p{margin-top:4px}
footer .big{display:inline-block;margin-top:16px;background:var(--green);color:#fff;text-decoration:none;
  font-weight:700;padding:11px 22px;border-radius:999px}
footer small{display:block;margin-top:22px;color:#8E867B;font-size:12px}

/* lightbox */
.lb{position:fixed;inset:0;background:rgba(20,17,15,.92);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
.lb.open{display:flex}
.lb img{max-height:92vh;max-width:100%;border-radius:10px}
.lb button{position:absolute;top:12px;right:14px;background:none;border:0;color:#fff;font-size:34px;cursor:pointer;line-height:1}
</style>
</head>
<body>

<div class="topbar">
  <div class="wrap">
    <a class="brand" href="/"><b>YZ STUDIO</b> <span>宇宙工作室</span></a>
    <a class="wa-mini" href="https://wa.me/60108326759?text=%E4%BD%A0%E5%A5%BD%EF%BC%8C%E6%88%91%E6%83%B3%E5%85%85%E5%80%BC" target="_blank" rel="noopener">WhatsApp 下单</a>
  </div>
</div>

<nav class="chips" aria-label="游戏目录"><div class="wrap" id="chips"></div></nav>

<header class="head">
  <div class="wrap">
    <span class="eyebrow">Price List · 价格表合集</span>
    <h1>全部游戏充值价格</h1>
    <p class="lead">按热门程度排列，点上方游戏名可直接跳到对应价格表，点图片可放大查看。</p>
    <div class="notes">
      <span>马币付款 DuitNow / Bank / TNG</span>
      <span>价格随汇率浮动，以下单报价为准</span>
      <span>客服 11:00 – 22:00</span>
    </div>
  </div>
</header>

<main class="wrap"><div class="grid" id="grid"></div></main>

<footer>
  <div class="wrap">
    <h3>找不到你玩的游戏？</h3>
    <p>还有更多中国区游戏可以代充，直接 WhatsApp 问我们，回复当下确认价格。</p>
    <a class="big" href="https://wa.me/60108326759?text=%E4%BD%A0%E5%A5%BD%EF%BC%8C%E6%88%91%E6%83%B3%E9%97%AE%E4%BB%B7%E6%A0%BC" target="_blank" rel="noopener">WhatsApp +60 10-832 6759</a>
    <small>YZ Studio 宇宙工作室 · SSM 注册商号 NS0267249-H</small>
  </div>
</footer>

<div class="lb" id="lb" role="dialog" aria-modal="true"><button aria-label="关闭">×</button><img alt=""></div>

<script>
// 顺序 = 热门程度。要调整顺序，直接移动这里的行即可。
const GAMES = [
  { id:'wangzhe',     name:'王者荣耀',          tag:'安卓',       hot:true, img:'01-wangzhe.png' },
  { id:'heping',      name:'和平精英',          tag:'安卓',       hot:true, img:'02-heping.png' },
  { id:'huoying',     name:'火影忍者',          tag:'安卓',       hot:true, img:'04-huoying.png' },
  { id:'wuwei',       name:'无畏契约',          tag:'安卓',       hot:true, img:'05-wuwei.png' },
  { id:'zhongguo',    name:'其他中国游戏',      tag:'安卓',       img:'11-zhongguo.png' },
  { id:'ios',         name:'iOS 苹果卡',        tag:'iOS',        img:'12-ios-apple.png' },
  { id:'sanjiaozhou', name:'三角洲行动',        tag:'安卓',       img:'06-sanjiaozhou.png' },
  { id:'codm',        name:'使命召唤手游',      tag:'安卓',       img:'07-shiming.png' },
  { id:'danzai',      name:'蛋仔派对',          tag:'安卓',       img:'08-danzai.png' },
  { id:'qqfeiche',    name:'QQ飞车',            tag:'安卓',       img:'09-qqfeiche.png' },
  { id:'yuanmeng',    name:'元梦之星',          tag:'安卓',       img:'10-yuanmeng.png' },
];
const WA = 'https://wa.me/60108326759?text=';
const grid = document.getElementById('grid'), chips = document.getElementById('chips');

GAMES.forEach((g, i) => {
  const msg = encodeURIComponent(`你好，我想充值 ${g.name}（${g.tag}）`);
  grid.insertAdjacentHTML('beforeend', `
    <article class="card" id="${g.id}">
      <div class="card-head">
        <span class="rank">${String(i+1).padStart(2,'0')}</span>
        <h2>${g.name}</h2>
        <span class="tag${g.hot ? ' hot' : ''}">${g.hot ? '热门 · ' : ''}${g.tag}</span>
      </div>
      <button class="shot" type="button" aria-label="放大 ${g.name} 价格表">
        <img src="image/price/${g.img}" alt="${g.name} ${g.tag} 充值价格表" loading="${i < 2 ? 'eager' : 'lazy'}"
             onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'missing',textContent:'图片待上传'}))">
      </button>
      <div class="card-foot"><a class="order" href="${WA}${msg}" target="_blank" rel="noopener">WhatsApp 下单 ${g.name}</a></div>
    </article>`);
  chips.insertAdjacentHTML('beforeend', `<a href="#${g.id}">${g.name}</a>`);
});

// 放大查看
const lb = document.getElementById('lb'), lbImg = lb.querySelector('img');
grid.addEventListener('click', e => {
  const img = e.target.closest('.shot')?.querySelector('img');
  if (!img) return;
  lbImg.src = img.src; lbImg.alt = img.alt; lb.classList.add('open');
});
lb.addEventListener('click', e => { if (e.target !== lbImg) lb.classList.remove('open'); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') lb.classList.remove('open'); });

// 滚动时高亮当前游戏
const links = [...chips.querySelectorAll('a')];
const io = new IntersectionObserver(entries => {
  entries.forEach(en => {
    if (!en.isIntersecting) return;
    links.forEach(a => {
      const on = a.getAttribute('href') === '#' + en.target.id;
      a.classList.toggle('on', on);
      if (on) chips.scrollTo({ left: a.offsetLeft - chips.clientWidth / 2 + a.offsetWidth / 2, behavior:'smooth' });
    });
  });
}, { rootMargin:'-45% 0px -50% 0px' });
document.querySelectorAll('.card').forEach(c => io.observe(c));
</script>
</body>
</html>
